worker_processes 1;
events { worker_connections 512; }
http {
  server_tokens off;
  server {
    listen 80;
    client_max_body_size 5m;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Routes internes : jamais exposées au public
    location ~ ^/api/events/[^/]+/(hold|confirm-hold|release-hold)$ { return 403; }

    location ~ ^/api/(auth|me|users)(/|$)                                        { proxy_pass http://user-service:8000; }
    location ~ ^/api/(events|my-events|categories|event-stats|admin/events)(/|$) { proxy_pass http://event-service:8000; }
    location ~ ^/api/(bookings|tickets|organizer|booking-stats)(/|$)             { proxy_pass http://booking-service:8000; }
    location /api/ { default_type application/json; return 404 '{"message":"Route inconnue."}'; }

    location / { proxy_pass http://frontend:8000; }
  }
}
