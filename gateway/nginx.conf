worker_processes 1;
events { worker_connections 512; }
http {
  server_tokens off;
  server {
    listen 80;
    client_max_body_size 5m;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP raisonnable : scripts externes uniquement, styles inline tolérés
    # (attributs style= utilisés par le JS), polices Google Fonts autorisées.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # HSTS : uniquement quand le trafic est chiffré (la gateway locale est en HTTP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Routes internes : jamais exposées au public
    location ~ ^/api/events/[^/]+/(hold|confirm-hold|release-hold)$ { return 403; }

    location ~ ^/api/(auth|me|users)(/|$)                                        { proxy_pass http://user-service:8000; }
    location ~ ^/api/(events|my-events|categories|event-stats|admin/events|venues)(/|$) { proxy_pass http://event-service:8000; }
    location ~ ^/api/(bookings|tickets|organizer|booking-stats)(/|$)             { proxy_pass http://booking-service:8000; }
    location /api/ { default_type application/json; return 404 '{"message":"Route inconnue."}'; }

    location / { proxy_pass http://frontend:8000; }
  }
}
