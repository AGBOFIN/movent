name: Validation MOVENT (Docker de bout en bout)

on:
  push:
    branches: [deploy-prod, ci/**]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fichier .env de test (secrets factices, jamais commité)
        run: cp .env.example .env

      - name: Validation de la configuration Compose
        run: docker compose config -q && docker compose -f docker-compose.prod.yml config -q

      - name: Build des images (stack locale)
        run: docker compose build

      - name: Démarrage de la stack locale (8 conteneurs)
        run: docker compose up -d

      - name: Attente que la passerelle réponde
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/events -o /tmp/events.json; then
              echo "Gateway OK après ${i}0s"; head -c 400 /tmp/events.json; exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT gateway"; exit 1

      - name: État des conteneurs + santé
        run: docker compose ps

      - name: Tests PHPUnit — user-service
        run: docker compose exec -T user-service php artisan test

      - name: Tests PHPUnit — event-service (sqlite :memory:, hors test de concurrence pgsql)
        run: docker compose exec -T event-service php vendor/bin/phpunit -c phpunit.xml --exclude-filter test_deux_holds_simultanes_dernieres_places_un_seul_reussit

      - name: Tests de concurrence sur PostgreSQL réel (anti-survente)
        run: |
          set -o pipefail
          # Base de test dédiée et jetable (movent_events_test).
          # createdb échoue si elle existe déjà : sans gravité, migrate:fresh la nettoie.
          docker compose exec -T event-db createdb -U movent movent_events_test || true
          docker compose exec -T -e DB_DATABASE=movent_events_test event-service \
            php artisan migrate:fresh --force --no-interaction 2>&1 | tee /tmp/pgsql-test.log
          docker compose exec -T -e DB_DATABASE=movent_events_test event-service \
            php vendor/bin/phpunit -c phpunit.pgsql.xml --filter test_deux_holds --display-warnings --display-deprecations 2>&1 | tee -a /tmp/pgsql-test.log

      - name: Tests PHPUnit — booking-service
        run: |
          set -o pipefail
          docker compose exec -T booking-service php artisan test 2>&1 | tee /tmp/booking-test.log

      - name: Parcours de validation (inscription → événement → modération → réservation → paiement → billet)
        run: bash scripts/e2e-smoke.sh http://localhost:8080

      - name: "Mémoire des conteneurs (VM cible : 4 Go)"
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}"

      - name: Build + démarrage stack PRODUCTION (Caddy, DOMAIN=:80 → HTTP)
        run: |
          sed -i 's/^DOMAIN=.*/DOMAIN=:80/' .env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/localhost/' .env
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d

      - name: Attente passerelle prod (port 80)
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost/api/events -o /tmp/events-prod.json; then
              echo "Prod OK après ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT prod"; exit 1

      - name: Smoke test prod (pages + API + routes internes bloquées)
        run: bash scripts/e2e-smoke.sh http://localhost

      - name: Mémoire stack prod
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}"

      - name: Logs Caddy (diagnostic HTTPS)
        if: always()
        run: docker compose -f docker-compose.prod.yml logs caddy | tail -40

      - name: Publier le diagnostic PHPUnit en commentaire de commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### CI — test de concurrence pgsql"; echo '```'; if [ -f /tmp/pgsql-test.log ]; then tail -80 /tmp/pgsql-test.log; else echo "(log absent)"; fi; echo '```';
            echo "### CI — tests booking-service"; echo '```'; if [ -f /tmp/booking-test.log ]; then tail -120 /tmp/booking-test.log; else echo "(log absent)"; fi; echo '```'; } > /tmp/comment.md
          jq -n --rawfile body /tmp/comment.md '{body: $body}' \
            | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - \
            || { echo "GH_COMMENT_FAILED"; gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - 2>&1 | tail -5; }

      - name: Diagnostics en cas d'échec
        if: failure()
        run: |
          echo "===== docker compose ps ====="
          docker compose ps || true
          echo "===== logs conteneurs (200 dernières lignes) ====="
          docker compose logs --tail=200 || true
          docker compose -f docker-compose.prod.yml ps || true
          docker compose -f docker-compose.prod.yml logs --tail=200 || true

      - name: Arrêt stack prod
        if: always()
        run: docker compose -f docker-compose.prod.yml down

      - name: Arrêt stack locale
        if: always()
        run: docker compose down
